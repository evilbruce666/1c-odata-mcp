version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Группируем, чтобы не плодить десятки PR.
      dev-dependencies:
        dependency-type: "development"
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # typescript 7 — мажор, который тянут в группу dev-зависимостей: он выходит
      # за peer-диапазон typescript-eslint (>=4.8.4 <6.1.0), и весь PR становится
      # неустановимым (npm ci падает на ERESOLVE). Мажор — отдельной задачей,
      # когда typescript-eslint объявит поддержку.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
