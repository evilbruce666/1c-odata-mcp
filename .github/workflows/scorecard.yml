name: OpenSSF Scorecard

# Оценка практик безопасности репозитория (закреплённые действия, права токенов, защита ветки, SAST и др.).
# Результаты — во вкладке Security и на scorecard.dev.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # загрузка результатов во вкладку Security
      id-token: write # публикация результатов на scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
