name: Publish to MCP registry

# Официальный реестр MCP. Отдельным файлом, а не задачей в publish.yml: npm доверяет публикацию (Trusted Publishing)
# по имени workflow, и OIDC-токен задачи из publish.yml годился бы и для npm. Запускается после успешной публикации по
# тегу; если упадёт — npm и релиз уже вышли, повторить можно только этот запуск («Re-run failed jobs»).
on:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]

permissions: {}

jobs:
  registry:
    # Только свой publish.yml, запущенный пушем тега в этом репозитории: workflow_run сработал бы и на одноимённый
    # workflow из чужой ветки.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/publish.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # вход в реестр по GitHub OIDC, без токенов и секретов
    env:
      # mcp-publisher закреплён версией и контрольной суммой: у задачи есть OIDC-токен. Обновляя версию, возьмите
      # sha256 архива из релиза github.com/modelcontextprotocol/registry.
      MCP_PUBLISHER_VERSION: v1.8.16
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
    steps:
      # Из коммита выпуска берётся только server.json и номер версии; код из него не запускается.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Ветка с именем на «v» не должна выглядеть релизом: публикуем, только если запуск — тег vX.Y.Z этой версии.
      - name: Проверить, что запуск — тег этой версии
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="$(jq -r .version package.json)"
          [ "$HEAD_BRANCH" = "v$version" ] || { echo "Запуск $HEAD_BRANCH не совпадает с версией v$version"; exit 1; }
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$version" >/dev/null

      # Реестр проверяет пакет в npm, а новая версия доезжает не сразу (в 1.2.0 архив несколько минут отвечал 404).
      - name: Дождаться пакета в npm
        run: |
          version="$(jq -r .version package.json)"
          for attempt in $(seq 1 60); do
            curl --fail --silent --head "https://registry.npmjs.org/1c-odata-mcp/-/1c-odata-mcp-$version.tgz" >/dev/null && exit 0
            sleep 10
          done
          echo "Пакет 1c-odata-mcp@$version так и не появился в npm"
          exit 1

      - name: Скачать и проверить mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/$archive"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check
          tar xzf "$archive" mcp-publisher

      - name: Опубликовать в реестре MCP
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
