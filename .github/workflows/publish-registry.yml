name: Publish to MCP registry

# Официальный реестр MCP. Отдельным файлом, а не задачей в publish.yml: npm доверяет публикацию (Trusted Publishing)
# по имени workflow, и OIDC-токен задачи из publish.yml годился бы и для npm. Запускается тем же тегом, что и
# публикация в npm, и ждёт, пока пакет появится в npm; если npm не опубликуется, задача упадёт по ожиданию. Упала —
# npm и релиз уже вышли, повторить можно только этот запуск («Re-run failed jobs»).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # вход в реестр по GitHub OIDC, без токенов и секретов
    env:
      # mcp-publisher закреплён версией и контрольной суммой: у задачи есть OIDC-токен. Обновляя версию, возьмите
      # sha256 архива из релиза github.com/modelcontextprotocol/registry.
      MCP_PUBLISHER_VERSION: v1.8.16
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
    steps:
      # Из коммита тега берётся только server.json и номер версии; код из него не запускается.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Тег должен совпадать с версией в package.json: иначе в реестр ушла бы не та версия.
      - name: Проверить, что тег — эта версия
        run: |
          version="$(jq -r .version package.json)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Тег $GITHUB_REF_NAME не совпадает с версией v$version"; exit 1; }

      # Реестр проверяет пакет в npm, а новая версия доезжает не сразу (в 1.2.0 архив несколько минут отвечал 404).
      - name: Дождаться пакета в npm
        run: |
          version="$(jq -r .version package.json)"
          # Публикация в npm идёт после тестов, это несколько минут: ждём до 30 минут.
          for attempt in $(seq 1 180); do
            curl --fail --silent --head "https://registry.npmjs.org/1c-odata-mcp/-/1c-odata-mcp-$version.tgz" >/dev/null && exit 0
            sleep 10
          done
          echo "Пакет 1c-odata-mcp@$version так и не появился в npm"
          exit 1

      - name: Скачать и проверить mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/$archive"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check
          tar xzf "$archive" mcp-publisher

      - name: Опубликовать в реестре MCP
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
