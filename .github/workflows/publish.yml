name: Publish to npm

# Публикация при пуше тега vX.Y.Z через npm Trusted Publishing (OIDC):
# токен не нужен — аутентификация по доверию между GitHub Actions и npm.
# Один раз настройте доверие: npmjs.com → пакет 1c-odata-mcp → Settings →
# Trusted Publishing → добавьте GitHub Actions (repo evilbruce666/1c-odata-mcp,
# workflow publish.yml). Provenance формируется автоматически.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # создание GitHub Release
      id-token: write # OIDC для Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # npm >= 11.5.1 нужен для Trusted Publishing. Пиним МАЖОР (не @latest):
      # npm@12.0.0 (вышла 2026-07-08) ломает provenance при self-upgrade на раннере
      # ("Cannot find module 'sigstore'") — сорвала публикацию 0.1.10. npm@11
      # получает патчи/миноры автоматически, но не подхватит следующий битый мажор.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      # prepublishOnly соберёт пакет и уберёт probe-скрипты; токен не передаётся
      - run: npm publish --access public

      # GitHub Release с заметками из секции CHANGELOG для этой версии.
      # Чтобы заметки попали в релиз, финализируйте CHANGELOG (перенесите
      # «Не выпущено» в «## [X.Y.Z] — дата») ДО `npm version` и тега.
      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="## [$version]" '
            index($0, v) == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          [ -z "$notes" ] && notes="Релиз $GITHUB_REF_NAME. См. CHANGELOG.md и npm."
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"

  # Официальный реестр MCP. Отдельной задачей: если она упадёт, npm и релиз уже вышли, а повторить можно только её
  # («Re-run failed jobs») — в общей задаче повтор упёрся бы в уже опубликованную версию npm.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # вход в реестр по GitHub OIDC, без токенов и секретов
    env:
      # mcp-publisher закреплён версией и контрольной суммой: у задачи есть OIDC-токен. Обновляя версию, возьмите
      # sha256 архива из релиза github.com/modelcontextprotocol/registry.
      MCP_PUBLISHER_VERSION: v1.8.16
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
    steps:
      - uses: actions/checkout@v7

      # Реестр проверяет пакет в npm, а новая версия доезжает не сразу (в 1.2.0 архив несколько минут отвечал 404).
      - name: Дождаться пакета в npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 60); do
            curl --fail --silent --head "https://registry.npmjs.org/1c-odata-mcp/-/1c-odata-mcp-$version.tgz" >/dev/null && exit 0
            sleep 10
          done
          echo "Пакет 1c-odata-mcp@$version так и не появился в npm"
          exit 1

      - name: Скачать и проверить mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/$archive"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check
          tar xzf "$archive" mcp-publisher

      - name: Опубликовать в реестре MCP
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
