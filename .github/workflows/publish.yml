name: Publish to npm

# Публикация при пуше тега vX.Y.Z через npm Trusted Publishing (OIDC):
# токен не нужен — аутентификация по доверию между GitHub Actions и npm.
# Один раз настройте доверие: npmjs.com → пакет 1c-odata-mcp → Settings →
# Trusted Publishing → добавьте GitHub Actions (repo evilbruce666/1c-odata-mcp,
# workflow publish.yml). Provenance формируется автоматически.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # создание GitHub Release
      id-token: write # OIDC для Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm >= 11.5.1 нужен для Trusted Publishing; с Node 24 он идёт в комплекте (24.22 — npm 11.19), отдельная
          # установка npm не нужна. Тесты на Node 24 гоняет и CI.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm test
      # prepublishOnly соберёт пакет и уберёт probe-скрипты; токен не передаётся
      - run: npm publish --access public

      # Состав пакета (SBOM, CycloneDX) — только зависимости, которые ставятся вместе с пакетом. Прикладывается к релизу,
      # чтобы проверка поставщика у тех, кто встраивает коннектор, не собирала его заново.
      - run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json

      # GitHub Release с заметками из секции CHANGELOG для этой версии.
      # Чтобы заметки попали в релиз, финализируйте CHANGELOG (перенесите
      # «Не выпущено» в «## [X.Y.Z] — дата») ДО `npm version` и тега.
      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="## [$version]" '
            index($0, v) == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          [ -z "$notes" ] && notes="Релиз $GITHUB_REF_NAME. См. CHANGELOG.md и npm."
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" sbom.cdx.json
